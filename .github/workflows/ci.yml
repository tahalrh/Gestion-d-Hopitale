name: Java CI & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify Java Modular System
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Java Modules
        run: |
          mkdir -p bin
          javac -d bin \
            module-info.java \
            app/Main.java \
            config/*.java \
            model/*.java \
            security/*.java \
            service/*.java

      - name: Package Executable JAR
        run: |
          jar --create --file gestion-hopital.jar --main-class app.Main -C bin .

      - name: Test Application Execution
        run: |
          java -jar gestion-hopital.jar

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gestion-hopital:latest
